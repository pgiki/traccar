# Gradle daemon heap (raise on dev machines via ~/.gradle/gradle.properties if needed).
# Small VPSs often default to ~256m and hit OOM during compile; 1g is a practical floor.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
# Fewer parallel workers lowers peak RAM during Java compile on low-memory hosts.
org.gradle.workers.max=2
